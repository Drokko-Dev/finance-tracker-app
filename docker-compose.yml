services:
  db:
    image: postgres:15
    container_name: finanzas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finanzas
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: finanzas-backend
    # --- AQUÍ SE AGREGA ---
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    # -----------------------
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # <- clave
    networks:
      - app-network
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: finanzas-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
